# Gizli-bilgi taramasi: her push ve PR'da calisir, bulguda pipeline basarisiz olur.
name: secret-scan

on:
  push:
  pull_request:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gizli bilgi taramasi (takip edilen dosyalar)
        run: python scripts/check_secrets.py
      - name: Gecmis blob taramasi (tum branch/tag)
        run: python scripts/check_secrets.py --history
